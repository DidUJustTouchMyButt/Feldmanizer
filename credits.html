<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feldmanizer photo credits</title>
  <style>
    :root { color-scheme: light dark; --bg:#fdf7f2; --fg:#1d1a24; --muted:#6c6577; --line:#e7dcd3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17141d; --fg:#f3eef6; --muted:#a59db0; --line:#2d2836; } }
    body { margin:0; padding:32px 16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:760px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:24px; }
    p { margin:0 0 24px; color:var(--muted); }
    ul { list-style:none; margin:0; padding:0; }
    li { display:flex; gap:14px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
    li img { width:56px; height:56px; object-fit:cover; border-radius:8px; flex:none; }
    li div { display:flex; flex-direction:column; min-width:0; }
    li div > a { overflow-wrap:anywhere; }
    li span { color:var(--muted); font-size:13.5px; }
    a { color:inherit; }
  </style>
  <script src="photos.js"></script>
  <script src="credits.js" defer></script>
</head>
<body>
  <main>
    <h1>Photo credits</h1>
    <p>
      All <span id="count"></span> photos are Creative Commons licensed, from Wikimedia Commons and Flickr.
      They were resized for this extension; nothing else was changed.
      Photos marked NC are licensed for non-commercial use only.
    </p>
    <ul id="list"></ul>
  </main>
</body>
</html>
